# ============================================================
# docker-compose.yml — agent-harness 一键部署（api + nginx）
# 一步到位：docker compose up -d --build（前端在容器内构建，宿主无需 Node/npm）
# 访问：http://localhost（nginx 托管前端静态 + /api 反代到后端）
# 停止：docker compose down
# 日志：docker compose logs -f api
# ============================================================

version: "3.8"

services:
  # ==================== 后端 API ====================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-harness-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # 默认 Mock 模式零配置可跑；接真实 DeepSeek 时在宿主机 .env 配置后置 LLM_BACKEND=deepseek
      # （docker compose 自动读取项目根 .env 作为变量来源）
      LLM_BACKEND: ${LLM_BACKEND:-mock}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      BASE_URL: ${BASE_URL:-https://api.deepseek.com}
      MODEL_NAME: ${MODEL_NAME:-deepseek-flash}
    volumes:
      # SQLite 持久化：容器内 /app/data/agent-harness.db 落宿主机 ./data
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================== 前端 Nginx（多阶段构建：node 构建 dist → nginx 自包含）====================
  # 不需要宿主 Node：compose build 时在容器内 npm ci + build，nginx 镜像自带 dist 与反代配置
  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: agent-harness-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

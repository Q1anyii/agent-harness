# ============================================================
# Nginx 生产配置（conf.d/default.conf 片段）
# agent-harness —— 前后端分离部署
#   静态根  /usr/share/nginx/html（前端 build 产物 dist/，compose 挂载）
#   后端    api:8000（Docker DNS，api 容器重建后自动跟上）
#   说明    本机演示/笔试用 80 纯 HTTP；上 HTTPS 参照 Mitta 的 ssl 配置（证书 + 301）
# ============================================================

client_max_body_size 20m;

# Docker 内置 DNS：每 30s 重新解析 api 容器 IP（无需重启 nginx）
resolver 127.0.0.11 valid=30s ipv6=off;

# ---- Gzip ----
gzip  on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_comp_level 5;
gzip_types text/plain text/css text/xml text/javascript
           application/javascript application/json application/xml+rss image/svg+xml;

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # 动态后端地址：变量 + resolver 实现运行时 DNS 解析（不在启动时写死 IP）
    set $api_upstream http://api:8000;

    # 静态资源长缓存（前端产物带 hash 文件名，immutable 安全）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API 反代：proxy_buffering off 是关键——
    # 本项目流式输出走 /api/.../events 轮询 + message_delta 增量事件，
    # 开启缓冲会让 nginx 攒满响应才转发，流式增量被延迟/粘包
    location /api/ {
        proxy_pass         $api_upstream;
        proxy_http_version 1.1;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_connect_timeout 30s;
        proxy_send_timeout    30s;
        proxy_read_timeout    300s;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # SPA fallback：单页应用直接访问 /sessions/xxx 等路径时回退 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
